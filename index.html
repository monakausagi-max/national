<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>世界の国宝ギャラリー</title>
<style>
:root{--bg:#eceeed;--card:#fff;--ink:#1d2623;--sub:#5f6c67;--line:#d3d9d6;--ac:#2f6b5a;--acbg:#dcebe6}
@media (prefers-color-scheme:dark){:root{--bg:#121816;--card:#1b2420;--ink:#e5ede9;--sub:#93a39c;--line:#2a3631;--ac:#7cc7ae;--acbg:#1f3a32}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
header,.wrap{max-width:1100px;margin:auto;padding:0 16px}
header{padding-top:20px}
h1{margin:0;font:700 24px/1.3 "Hiragino Mincho ProN","Yu Mincho",serif;letter-spacing:.04em}
.sub{color:var(--sub);font-size:13px;margin:4px 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 14px;border-radius:999px;cursor:pointer}
button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
h2{font:700 18px/1.4 "Hiragino Mincho ProN","Yu Mincho",serif;margin:8px 0}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;padding-bottom:48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer}
.card .im{aspect-ratio:4/3;background:var(--acbg);display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .tx{padding:8px 12px 10px}
.card b{display:block}
.card small{color:var(--sub)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;z-index:9;color:#fff}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:72vh;object-fit:contain}
#lb p{max-width:720px;margin:10px 0 4px;font-size:14px;text-align:center}
#lb a{color:#9fe0cb}
#lb button{margin-top:8px}
.note{color:var(--sub);font-size:12px;padding-bottom:32px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<header>
  <h1>世界の国宝ギャラリー</h1>
  <p class="sub">国を選ぶと、その国を代表する国宝・文化遺産の画像が並びます。画像をクリックすると拡大して、説明と出典を見られます。</p>
  <div class="chips" id="chips"></div>
</header>
<div class="wrap">
  <h2 id="ttl"></h2>
  <div id="grid"></div>
  <p class="note">画像と説明はWikipedia(Wikimedia Commons)から取得しています。各画像のライセンスと作者は、拡大画面の「出典」リンク先で確認できます。「国宝」は国ごとに制度が異なるため、日本・韓国のように法的な指定がある国はその指定物を、そうでない国は国を代表する文化財・遺産を選んでいます。</p>
</div>
<div id="lb" role="dialog" aria-modal="true"><img alt=""><p id="lbT"></p><a id="lbA" target="_blank" rel="noopener">出典(Wikipedia)</a><button id="lbX">閉じる</button></div>

<script>
// [日本語名, Wikipediaの英語記事タイトル]
const DATA={
"日本":[["姫路城","Himeji Castle"],["法隆寺","Hōryū-ji"],["平等院","Byōdō-in"],["厳島神社","Itsukushima Shrine"],["松本城","Matsumoto Castle"],["犬山城","Inuyama Castle"],["彦根城","Hikone Castle"],["松江城","Matsue Castle"],["東大寺","Tōdai-ji"],["清水寺","Kiyomizu-dera"],["中尊寺","Chūson-ji"],["鎌倉大仏","Great Buddha of Kamakura"]],
"韓国":[["仏国寺","Bulguksa"],["石窟庵","Seokguram"],["昌徳宮","Changdeokgung"],["景福宮","Gyeongbokgung"],["水原華城","Hwaseong Fortress"],["海印寺","Haeinsa"],["崇礼門(南大門)","Sungnyemun"],["宗廟","Jongmyo"]],
"中国":[["兵馬俑","Terracotta Army"],["紫禁城","Forbidden City"],["天壇","Temple of Heaven"],["莫高窟","Mogao Caves"],["ポタラ宮","Potala Palace"],["楽山大仏","Leshan Giant Buddha"],["万里の長城","Great Wall of China"],["頤和園","Summer Palace, Beijing"],["龍門石窟","Longmen Grottoes"]],
"インド":[["タージ・マハル","Taj Mahal"],["レッド・フォート","Red Fort"],["クトゥブ・ミナール","Qutb Minar"],["カジュラホ","Khajuraho Group of Monuments"],["アジャンター石窟群","Ajanta Caves"],["コナーラクの太陽寺院","Konark Sun Temple"],["ハンピ","Hampi"],["黄金寺院","Golden Temple"]],
"エジプト":[["ギザの大スフィンクス","Great Sphinx of Giza"],["ギザの大ピラミッド","Great Pyramid of Giza"],["ツタンカーメンの黄金のマスク","Mask of Tutankhamun"],["アブ・シンベル神殿","Abu Simbel temples"],["カルナック神殿","Karnak"],["王家の谷","Valley of the Kings"]],
"ギリシャ":[["パルテノン神殿","Parthenon"],["アテネのアクロポリス","Acropolis of Athens"],["デルフィ","Delphi"],["メテオラ","Meteora"],["オリンピアのゼウス神殿","Temple of Olympian Zeus"],["ミロのヴィーナス","Venus de Milo"]],
"イタリア":[["コロッセオ","Colosseum"],["ピサの斜塔","Leaning Tower of Pisa"],["ダビデ像","David (Michelangelo)"],["パンテオン","Pantheon, Rome"],["フィレンツェ大聖堂","Florence Cathedral"],["トレヴィの泉","Trevi Fountain"],["ポンペイ","Pompeii"]],
"フランス":[["エッフェル塔","Eiffel Tower"],["モナ・リザ","Mona Lisa"],["ヴェルサイユ宮殿","Palace of Versailles"],["モン・サン=ミシェル","Mont-Saint-Michel"],["ノートルダム大聖堂","Notre-Dame de Paris"],["凱旋門","Arc de Triomphe"],["ルーヴル美術館","Louvre"]],
"スペイン":[["アルハンブラ宮殿","Alhambra"],["サグラダ・ファミリア","Sagrada Família"],["コルドバのメスキータ","Mosque–Cathedral of Córdoba"],["セビリアのアルカサル","Alcázar of Seville"],["アビラの城壁","Walls of Ávila"],["セゴビアの水道橋","Aqueduct of Segovia"]],
"ドイツ":[["ノイシュヴァンシュタイン城","Neuschwanstein Castle"],["ケルン大聖堂","Cologne Cathedral"],["ブランデンブルク門","Brandenburg Gate"],["ネブラの天空円盤","Nebra sky disc"],["ヴュルツブルク司教館","Würzburg Residence"],["アーヘン大聖堂","Aachen Cathedral"]],
"イギリス":[["ストーンヘンジ","Stonehenge"],["ロンドン塔","Tower of London"],["ウェストミンスター寺院","Westminster Abbey"],["ビッグ・ベン","Big Ben"],["エディンバラ城","Edinburgh Castle"],["ダラム大聖堂","Durham Cathedral"]],
"ロシア":[["聖ワシリー大聖堂","Saint Basil's Cathedral"],["エルミタージュ美術館","Hermitage Museum"],["ペテルゴフ宮殿","Peterhof Palace"],["キジ島の木造教会群","Kizhi Pogost"],["モスクワのクレムリン","Moscow Kremlin"]],
"トルコ":[["アヤソフィア","Hagia Sophia"],["ギョベクリ・テペ","Göbekli Tepe"],["カッパドキア","Cappadocia"],["パムッカレ","Pamukkale"],["エフェソス","Ephesus"],["トプカプ宮殿","Topkapı Palace"]],
"ヨルダン":[["ペトラ","Petra"],["ジェラシュ","Jerash"],["ワディ・ラム","Wadi Rum"]],
"カンボジア":[["アンコール・ワット","Angkor Wat"],["バイヨン","Bayon"],["タ・プローム","Ta Prohm"],["バンテアイ・スレイ","Banteay Srei"]],
"ペルー":[["マチュピチュ","Machu Picchu"],["ナスカの地上絵","Nazca Lines"],["チャンチャン遺跡","Chan Chan"],["サクサイワマン","Sacsayhuamán"],["クエラップ要塞","Kuelap"]],
"メキシコ":[["チチェン・イッツァ","Chichen Itza"],["テオティワカン","Teotihuacan"],["パレンケ","Palenque"],["太陽の石(アステカ暦石)","Aztec calendar stone"],["トゥルム","Tulum, Mexico"]]
};
const $=id=>document.getElementById(id);
const cache={};
let cur="日本",token=0;

async function summary(title){
  if(cache[title])return cache[title];
  const r=await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(title.replace(/ /g,"_")));
  if(!r.ok)throw new Error(r.status);
  return cache[title]=await r.json();
}

async function show(country){
  cur=country;const my=++token;
  document.querySelectorAll("#chips button").forEach(b=>b.classList.toggle("on",b.textContent===country));
  $("ttl").textContent=`${country}(${DATA[country].length}件)`;
  const g=$("grid");g.replaceChildren();
  DATA[country].forEach(([ja,en])=>{
    const c=document.createElement("div");c.className="card";c.tabIndex=0;
    const im=document.createElement("div");im.className="im";im.textContent="読み込み中…";
    const tx=document.createElement("div");tx.className="tx";
    const b=document.createElement("b");b.textContent=ja;const s=document.createElement("small");s.textContent=en;
    tx.append(b,s);c.append(im,tx);g.append(c);
    summary(en).then(d=>{
      if(my!==token)return;
      const src=d.thumbnail&&d.thumbnail.source;
      if(!src){im.textContent="画像なし";return}
      const img=document.createElement("img");img.alt=ja;img.loading="lazy";img.src=src;
      img.onerror=()=>{im.textContent="画像を表示できません"};
      im.replaceChildren(img);
      const open=()=>lightbox(ja,en,d);
      c.onclick=open;c.onkeydown=e=>{if(e.key==="Enter")open()};
    }).catch(()=>{if(my===token)im.textContent="取得できませんでした"});
  });
}

function lightbox(ja,en,d){
  const src=(d.originalimage&&d.originalimage.source)||(d.thumbnail&&d.thumbnail.source);
  const img=$("lb").querySelector("img");img.src=src;img.alt=ja;
  $("lbT").textContent=`${ja}(${en}) — ${d.extract||""}`;
  $("lbA").href=(d.content_urls&&d.content_urls.desktop.page)||"https://en.wikipedia.org/wiki/"+encodeURIComponent(en);
  $("lb").classList.add("on");$("lbX").focus();
}
const closeLb=()=>$("lb").classList.remove("on");
$("lbX").onclick=closeLb;
$("lb").addEventListener("click",e=>{if(e.target===$("lb"))closeLb()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeLb()});

Object.keys(DATA).forEach(k=>{const b=document.createElement("button");b.textContent=k;b.onclick=()=>show(k);$("chips").append(b)});
show(cur);
</script>
</body>
</html>
